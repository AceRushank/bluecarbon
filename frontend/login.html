<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Blue Carbon MRV Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .monospace { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-400 mb-2 text-xl">
                🌊
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Blue Carbon MRV</h1>
            <p class="text-sm text-slate-400">Sign in to access your portal</p>
        </div>

        <!-- Demo Accounts Info -->
        <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-xs space-y-2">
            <div class="text-slate-300 font-semibold flex items-center gap-1.5">
                <span>🔑</span> <span>Demo Credentials</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-slate-400 monospace">
                <div class="bg-slate-800 p-2 rounded border border-slate-700/50">
                    <span class="text-blue-400 block font-sans font-medium text-[11px]">Project Developer</span>
                    User: <strong class="text-slate-200">company</strong><br>
                    Pass: <strong class="text-slate-200">demo123</strong>
                </div>
                <div class="bg-slate-800 p-2 rounded border border-slate-700/50">
                    <span class="text-purple-400 block font-sans font-medium text-[11px]">Govt Regulator</span>
                    User: <strong class="text-slate-200">admin</strong><br>
                    Pass: <strong class="text-slate-200">govt2024</strong>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                <input type="text" id="username" required placeholder="e.g. company" 
                       class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                       class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div id="login-error" class="hidden p-3 bg-red-900/40 border border-red-500/50 text-red-300 text-xs rounded-lg"></div>

            <button type="submit" id="btn-submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-lg shadow-lg transition-colors flex justify-center items-center">
                Sign In
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const errBox = document.getElementById('login-error');
            const btn = document.getElementById('btn-submit');
            errBox.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            btn.disabled = true;
            btn.innerHTML = `Signing in...`;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                // Store session credentials
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_role', data.role);
                localStorage.setItem('auth_username', data.username);

                // Redirect based on role
                if (data.role === 'admin') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/index.html';
                }
            } catch (err) {
                errBox.innerText = err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Sign In`;
            }
        }
    </script>
</body>
</html>
